params:
  problem_name: Square_beam
  comment: 5 step Adamw
  method: fm_nn_heaviside
  top_opt_method: CombinedMappingDecoderSDF
  penal: 3
  sigmoid_limits: false
  shape_combination: true
  splitting: false
  merging: false
  dens_interval: 40
  dens_offset: 0
  dens_start_iter: 40
  cleaning_interval: 10
  cleaning_offset: 5
  merging_markers:
  - 200
  merging_adaptation: 1
  axis_offset: 0.2
  scale_max: 3.0
  scale_min: 0.05

  shape_optimization_ranges:
  - - 40
    - 400
  refactoring_markers: []
  volfrac: 0.42
  volfrac_increment: 0.02
  volfrac_increment_marker: 20
  volfrac_increment_duration: 20
  smooth_k: 15
  N_cap: 2
  N_g: 2
  N_g_x: 2
  N_g_y: 1
  max_iter: 200
  config_name: VAE_DeepSDF_quad
  saved_model_name: frst_VAE_DeepSDF_quad_Bprec
  config_dir: ../configs/model
  input_dim: 10
  dataset_type: quadrangle
  merging_marker: 10
  merging_adaptation_length: 10
  compliance_w: 40000
  volfrac_w: 1000000
  ks_smooth_factor: 60
  treshold: 0.5
  gaussian_overlap_w: 0
  gaussian_overlap_scale: 1.3
  rc_loss_w: 100000
  reopen_enable: true
  reopen_start_iter: 30
  reopen_patience: 5
  reopen_improve_thresh: 0.015
  reopen_cooldown: 8
  reopen_adaptation: 5
  reopen_offset_step: 0.23
  reopen_scale_shrink: 0.5
  reopen_use_canonical_shape_without_prior: true
  reopen_force_zero_rotation_without_prior: true
  reopen_canonicalize_old_feature_shapes: false
  reopen_old_feature_canonical_blend: 0.4
  reopen_old_feature_offset_canonical_blend: 0.9
  reopen_direction_mode_without_prior: 8way
  reopen_direction_probe_scale: 1.0
  init_scale:
  - 0.2
  - 0.2
  
  
  init_rotation:
  - 0
  - 0
  
  
